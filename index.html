    let allMembers = [];

    function sanitizeExtension(row, header) {
      const extIdx = header.findIndex(h => h.includes('分機') || h.includes('專線'));
      let candidates = [];
      if (extIdx >= 0) {
        candidates.push(row[extIdx]);
        if (row[extIdx + 1]) candidates.push(row[extIdx + 1]);
      }

      for (let cand of candidates) {
        if (!cand) continue;
        const line = cand.split(/[\r\n]+/)[0].trim();
        let clean = line.replace(/^[OF]:\s*/i, '').trim();
        if (clean.includes('#')) {
          return `#${clean.split('#')[1].trim()}`;
        }
        if (clean && clean !== 'O:' && clean !== 'F:' && clean.length > 2) {
          return clean;
        }
      }
      return '無分機';
    }

    function getDirectImageUrl(url) {
      if (!url) return '';
      const match = url.match(/(?:open\?id=|file\/d\/|uc\?id=)([a-zA-Z0-9_-]+)/);
      if (match && match[1]) {
        return `https://drive.google.com/thumbnail?id=${match[1]}&sz=w600`;
      }
      return url;
    }

    function getSurname(name) {
      if (!name) return '友';
      const trimmed = name.trim();
      const compound = ['歐陽', '司馬', '諸葛', '公孫', '皇甫', '夏侯', '辰野'];
      for (const cs of compound) {
        if (trimmed.startsWith(cs)) return cs;
      }
      return trimmed.charAt(0);
    }

    function renderAvatar(name, photoUrl, size = 'md') {
      const surname = getSurname(name);
      const directUrl = getDirectImageUrl(photoUrl);
      const szClass = size === 'lg' ? 'w-24 h-24 text-3xl' : 'w-16 h-16 text-2xl';

      const fallbackHtml = `
        <div class="${szClass} rounded-2xl bg-gradient-to-br from-blue-600 to-indigo-800 text-white flex items-center justify-center font-bold shadow-md ring-4 ring-white shrink-0">
          ${surname}
        </div>`;

      if (!directUrl) return fallbackHtml;

      return `
        <img src="${directUrl}" alt="${name}" 
          class="${szClass} rounded-2xl object-cover ring-4 ring-white shadow-md shrink-0"
          onerror="this.outerHTML='<div class=\\'${szClass} rounded-2xl bg-gradient-to-br from-blue-600 to-indigo-800 text-white flex items-center justify-center font-bold shadow-md ring-4 ring-white shrink-0\\'>${surname}</div>'">
      `;
    }

    function parseCSV(text) {
      if (!text) return [];
      const lines = text.split(/\r?\n/).filter(l => l.trim().length > 0);
      return lines.map(line => {
        const row = [];
        let inQuotes = false;
        let cur = '';
        for (let i = 0; i < line.length; i++) {
          const c = line[i];
          if (c === '"') { inQuotes = !inQuotes; }
          else if (c === ',' && !inQuotes) { row.push(cur.trim().replace(/^"|"$/g, '')); cur = ''; }
          else { cur += c; }
        }
        row.push(cur.trim().replace(/^"|"$/g, ''));
        return row;
      });
    }

    function buildRoster(hubbleCsv, nasaCsv) {
      const hRows = parseCSV(hubbleCsv);
      const nRows = parseCSV(nasaCsv);

      let hHeadIdx = 0;
      for (let i = 0; i < Math.min(hRows.length, 5); i++) {
        if (hRows[i].includes('姓名')) { hHeadIdx = i; break; }
      }
      const hHeader = hRows[hHeadIdx] || [];

      const nIdx = hHeader.indexOf('姓名');
      const enIdx = hHeader.indexOf('英文別名');
      const rkIdx = hHeader.indexOf('職級');
      const ttIdx = hHeader.indexOf('職稱');
      const phoneIdx = hHeader.findIndex(h => h.includes('電話'));
      const emIdx = hHeader.findIndex(h => h.includes('MAIL') || h.includes('mail'));
      const chatIdx = hHeader.indexOf('通訊APP');
      const seatIdx = hHeader.indexOf('座位編號');
      const compIdx = hHeader.indexOf('公司');
      const orgIdx = hHeader.indexOf('組織資料');

      const hMap = new Map();
      for (let i = hHeadIdx + 1; i < hRows.length; i++) {
        const r = hRows[i];
        if (!r || r.length <= nIdx) continue;
        const name = (r[nIdx] || '').trim();
        if (!name || name === '姓名') continue;

        const cleanExt = sanitizeExtension(r, hHeader);

        hMap.set(name, {
          name,
          englishName: enIdx >= 0 ? r[enIdx] : '',
          rank: rkIdx >= 0 && r[rkIdx] ? r[rkIdx] : '專員',
          title: ttIdx >= 0 && r[ttIdx] ? r[ttIdx] : '儲備幹部',
          extension: cleanExt,
          phone: phoneIdx >= 0 ? r[phoneIdx] : '',
          email: emIdx >= 0 ? r[emIdx] : '',
          chatApps: chatIdx >= 0 ? r[chatIdx] : '',
          seat: seatIdx >= 0 ? r[seatIdx] : '待定',
          company: compIdx >= 0 && r[compIdx] ? r[compIdx] : '雄獅',
          organization: orgIdx >= 0 && r[orgIdx] ? r[orgIdx] : '無組織資料',
        });
      }

      const nHeader = nRows[0] || [];
      const nmIdx = nHeader.findIndex(h => h.includes('姓名'));
      const roleIdx = nHeader.findIndex(h => h.includes('幹部'));
      const bdayIdx = nHeader.findIndex(h => h.includes('出生') || h.includes('生日'));
      const photoIdx = nHeader.findIndex(h => h.includes('照片') || h.includes('圖片'));
      const mbtiIdx = nHeader.findIndex(h => h.includes('MBTI'));
      const intIdx = nHeader.findIndex(h => h.includes('興趣'));
      const prjIdx = nHeader.findIndex(h => h.includes('負責業務') || h.includes('專案'));

      const nMap = new Map();
      for (let i = 1; i < nRows.length; i++) {
        const r = nRows[i];
        if (!r || r.length <= nmIdx) continue;
        const name = (r[nmIdx] || '').trim();
        if (!name || name === '中文姓名') continue;
        nMap.set(name, {
          nasaRole: roleIdx >= 0 ? r[roleIdx] : '',
          birthday: bdayIdx >= 0 ? r[bdayIdx] : '',
          photoUrl: photoIdx >= 0 ? r[photoIdx] : '',
          mbti: mbtiIdx >= 0 ? r[mbtiIdx] : '',
          interests: intIdx >= 0 ? r[intIdx] : '',
          projectSummary: prjIdx >= 0 ? r[prjIdx] : '',
        });
      }

      const allNames = new Set([...hMap.keys(), ...nMap.keys()]);
      const list = [];
      allNames.forEach(name => {
        const h = hMap.get(name) || {};
        const n = nMap.get(name) || {};
        list.push({
          name,
          englishName: h.englishName || '',
          rank: h.rank || '專員',
          title: h.title || '儲備幹部',
          extension: h.extension || '無分機',
          phone: h.phone || '',
          email: h.email || '',
          chatApps: h.chatApps || '',
          seat: h.seat || '待定',
          company: h.company || '雄獅',
          organization: h.organization || 'NASA專案團隊',
          nasaRole: n.nasaRole || '',
          birthday: n.birthday || '',
          photoUrl: n.photoUrl || '',
          mbti: n.mbti || '',
          interests: n.interests || '',
          projectSummary: n.projectSummary || '',
        });
      });

      return list.sort((a, b) => {
        if (a.nasaRole && !b.nasaRole) return -1;
        if (!a.nasaRole && b.nasaRole) return 1;
        return a.name.localeCompare(b.name, 'zh-Hant');
      });
    }

    function updateDropdownOptions() {
      const compSelect = document.getElementById('select-company');
      const orgSelect = document.getElementById('select-org');
      const comps = new Set();
      const orgs = new Set();

      allMembers.forEach(m => {
        if (m.company && m.company !== 'undefined') comps.add(m.company.trim());
        if (m.organization && m.organization !== 'undefined' && m.organization !== '無組織資料') {
          const mainOrg = m.organization.split('/')[0].trim();
          if (mainOrg) orgs.add(mainOrg);
        }
      });

      compSelect.innerHTML = '<option value="ALL">全部公司</option>' + 
        Array.from(comps).map(c => `<option value="${c}">${c}</option>`).join('');

      orgSelect.innerHTML = '<option value="ALL">全部組織部門</option>' + 
        Array.from(orgs).map(o => `<option value="${o}">${o}</option>`).join('');
    }

    function renderUI() {
      const grid = document.getElementById('members-grid');
      const q = document.getElementById('input-search').value.toLowerCase().trim();
      const comp = document.getElementById('select-company').value;
      const org = document.getElementById('select-org').value;

      const filtered = allMembers.filter(m => {
        if (onlyOfficers && !m.nasaRole) return false;
        if (comp !== 'ALL' && m.company !== comp) return false;
        if (org !== 'ALL' && !m.organization.includes(org)) return false;
        if (q && !`${m.name} ${m.englishName} ${m.extension} ${m.seat} ${m.organization} ${m.mbti} ${m.interests}`.toLowerCase().includes(q)) return false;
        return true;
      });

      document.getElementById('stat-total').innerText = allMembers.length;
      document.getElementById('stat-officers').innerText = allMembers.filter(m => m.nasaRole).length;

      if (filtered.length === 0) {
        grid.innerHTML = '';
        document.getElementById('empty-state').classList.remove('hidden-custom');
        return;
      }

      document.getElementById('empty-state').classList.add('hidden-custom');

      grid.innerHTML = filtered.map(m => `
        <div onclick="openModal('${m.name}')" class="group bg-white rounded-2xl border border-slate-200/90 p-5 shadow-xs hover:shadow-xl hover:border-blue-400 hover:-translate-y-1 transition-all duration-200 cursor-pointer flex flex-col justify-between text-left">
          <div>
            <div class="flex items-center gap-3.5 mb-4">
              ${renderAvatar(m.name, m.photoUrl, 'md')}
              <div class="min-w-0 flex-1">
                <div class="flex items-center gap-1.5 flex-wrap">
                  <h3 class="text-lg font-bold text-slate-900 group-hover:text-blue-600 transition-colors">${m.name}</h3>
                  ${m.nasaRole ? `<span class="px-2 py-0.5 text-[11px] font-bold rounded-full bg-amber-100 text-amber-700">★ ${m.nasaRole}</span>` : ''}
                </div>
                <p class="text-xs text-slate-400 truncate">${m.englishName || 'Team Member'}</p>
                <span class="inline-block mt-1 px-2 py-0.5 text-[10px] rounded bg-blue-50 text-blue-600 font-semibold">${m.rank}</span>
              </div>
            </div>

            <div class="space-y-1.5 text-xs text-slate-600 border-t border-slate-100 pt-3">
              <div class="truncate">🏢 <span class="font-medium text-slate-700">${m.company}</span> · ${m.organization}</div>
              <div>📍 座位：<b>${m.seat}</b></div>
              <div>📞 分機：<b class="text-blue-700 font-mono text-sm">${m.extension}</b></div>
            </div>
          </div>

          <div class="mt-4 pt-2.5 border-t border-slate-100 flex items-center justify-between text-xs">
            ${m.mbti ? `<span class="px-2 py-0.5 rounded bg-purple-50 text-purple-700 font-semibold text-[11px]">MBTI: ${m.mbti}</span>` : '<span class="text-slate-400 text-[11px]">未填 MBTI</span>'}
            <span class="text-blue-600 font-medium group-hover:translate-x-1 transition-transform">查看詳情 →</span>
          </div>
        </div>
      `).join('');
    }

    function openModal(name) {
      const m = allMembers.find(x => x.name === name);
      if (!m) return;

      const fullEmail = m.email.includes('@') ? m.email : (m.email ? `${m.email}@liontravel.com` : '');

      const content = `
        <div class="flex flex-col sm:flex-row items-start sm:items-end justify-between gap-4 -mt-12 mb-4">
          <div class="relative">
            ${renderAvatar(m.name, m.photoUrl, 'lg')}
          </div>
          <div class="flex gap-2 w-full sm:w-auto">
            ${fullEmail ? `<a href="mailto:${fullEmail}" class="px-3.5 py-2 text-xs font-semibold text-white bg-blue-600 hover:bg-blue-700 rounded-xl">寄送信件</a>` : ''}
            <button onclick="navigator.clipboard.writeText('${m.name} 座位:${m.seat} 分機:${m.extension} 信箱:${fullEmail}'); alert('已複製聯絡資料！')" class="px-3.5 py-2 text-xs font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-xl cursor-pointer">複製資料</button>
          </div>
        </div>

        <div class="space-y-1">
          <div class="flex flex-wrap items-baseline gap-2.5">
            <h2 class="text-2xl font-bold text-slate-900">${m.name}</h2>
            <span class="text-base font-medium text-slate-500">${m.englishName}</span>
            <span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-blue-50 text-blue-700 border border-blue-200">${m.rank}</span>
            ${m.nasaRole ? `<span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-amber-50 text-amber-700 border border-amber-200">★ NASA ${m.nasaRole}</span>` : ''}
          </div>
          <p class="text-xs text-slate-600 pt-1">
            🏢 <b>${m.company}</b> · ${m.organization}
          </p>
        </div>

        <div class="mt-5 space-y-3.5 text-xs">
          <div class="bg-slate-50 rounded-2xl p-4 border border-slate-200 grid grid-cols-2 gap-3">
            <div>
              <span class="text-[10px] text-slate-400 block">座位編號</span>
              <span class="text-xs font-bold text-slate-800">${m.seat}</span>
            </div>
            <div>
              <span class="text-[10px] text-slate-400 block">分機專線</span>
              <span class="text-xs font-bold text-blue-700">${m.extension}</span>
            </div>
            <div>
              <span class="text-[10px] text-slate-400 block">行動電話</span>
              <span class="text-xs font-semibold text-slate-800">${m.phone || '無'}</span>
            </div>
            <div>
              <span class="text-[10px] text-slate-400 block">通訊軟體</span>
              <span class="text-xs font-semibold text-slate-800 whitespace-pre-line">${m.chatApps || '無'}</span>
            </div>
          </div>

          ${m.projectSummary ? `
            <div class="bg-blue-50/60 p-4 rounded-2xl border border-blue-100">
              <h4 class="text-[11px] font-bold text-blue-900 mb-1">負責業務 / 專案概述</h4>
              <p class="text-xs text-slate-700 leading-relaxed">${m.projectSummary}</p>
            </div>
          ` : ''}

          <div class="grid grid-cols-2 gap-3">
            <div class="p-3 bg-slate-50 rounded-xl border border-slate-200">
              <span class="text-[10px] text-slate-400 block">出生月日</span>
              <span class="text-xs font-semibold text-slate-800">${m.birthday || '未填寫'}</span>
            </div>
            <div class="p-3 bg-slate-50 rounded-xl border border-slate-200">
              <span class="text-[10px] text-slate-400 block">MBTI 性格</span>
              <span class="text-xs font-semibold text-purple-700">${m.mbti || '未填寫'}</span>
            </div>
          </div>

          ${m.interests ? `
            <div class="p-3 bg-amber-50 rounded-xl border border-amber-200">
              <span class="text-[10px] text-amber-800 block font-bold">個人興趣與生活愛好</span>
              <p class="text-xs text-slate-700 mt-1">${m.interests}</p>
            </div>
          ` : ''}
        </div>
      `;

      document.getElementById('modal-content').innerHTML = content;
      document.getElementById('detail-modal').classList.remove('hidden-custom');
    }

    function closeModal() {
      document.getElementById('detail-modal').classList.add('hidden-custom');
    }

    function handleFilterChange() { renderUI(); }

    function toggleOfficersFilter() {
      onlyOfficers = !onlyOfficers;
      const btn = document.getElementById('btn-officers');
      if (onlyOfficers) {
        btn.className = 'px-3 py-2 text-xs sm:text-sm font-medium rounded-xl bg-amber-500 text-white cursor-pointer shadow-xs whitespace-nowrap';
      } else {
        btn.className = 'px-3 py-2 text-xs sm:text-sm font-medium rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 cursor-pointer whitespace-nowrap';
      }
      renderUI();
    }

    async function syncData() {
      const icon = document.getElementById('sync-icon');
      const text = document.getElementById('sync-text');
      icon.classList.add('animate-spin-custom');
      text.innerText = '同步中...';

      try {
        const controller = new AbortController();
        const tid = setTimeout(() => controller.abort(), 4000);

        const [resH, resN] = await Promise.all([
          fetch(HUBBLE_URL, { signal: controller.signal }).then(r => r.ok ? r.text() : null).catch(() => null),
          fetch(NASA_URL, { signal: controller.signal }).then(r => r.ok ? r.text() : null).catch(() => null)
        ]);
        clearTimeout(tid);

        let hData = (resH && resH.includes('姓名')) ? resH : DEFAULT_HUBBLE;
        let nData = (resN && resN.includes('姓名')) ? resN : DEFAULT_NASA;

        allMembers = buildRoster(hData, nData);
        updateDropdownOptions();
        renderUI();

        document.getElementById('stat-time').innerText = '最新雲端同步';
        showToast('同步成功', '已即時載入試算表最新成員資料！');
      } catch (err) {
        allMembers = buildRoster(DEFAULT_HUBBLE, DEFAULT_NASA);
        updateDropdownOptions();
        renderUI();
        document.getElementById('stat-time').innerText = '使用完整名冊';
      } finally {
        icon.classList.remove('animate-spin-custom');
        text.innerText = '同步試算表';
      }
    }

    function showToast(title, msg) {
      const toast = document.getElementById('sync-toast');
      document.getElementById('sync-toast-title').innerText = title;
      document.getElementById('sync-toast-msg').innerText = msg;
      toast.classList.remove('hidden-custom');
      setTimeout(() => toast.classList.add('hidden-custom'), 3500);
    }

    function unlockApp() {
      document.getElementById('password-gate').classList.add('hidden-custom');
      document.getElementById('main-app').classList.remove('hidden-custom');

      allMembers = buildRoster(DEFAULT_HUBBLE, DEFAULT_NASA);
      updateDropdownOptions();
      renderUI();

      syncData();
    }

    function executeLogin() {
      const input = document.getElementById('input-password');
      const p = (input.value || '').trim();
      const remember = document.getElementById('checkbox-remember').checked;

      if (p === 'nasa7885') {
        try {
          if (remember) {
            localStorage.setItem('nasa_auth', 'true');
          } else {
            sessionStorage.setItem('nasa_auth', 'true');
          }
        } catch (e) {}
        unlockApp();
      } else {
        document.getElementById('password-error').classList.remove('hidden-custom');
        input.value = '';
        input.focus();
      }
    }

    function togglePasswordVisibility() {
      const input = document.getElementById('input-password');
      input.type = input.type === 'password' ? 'text' : 'password';
    }

    function lockApp() {
      try {
        localStorage.removeItem('nasa_auth');
        sessionStorage.removeItem('nasa_auth');
      } catch (e) {}
      location.reload();
    }

    window.addEventListener('DOMContentLoaded', () => {
      let isAuth = false;
      try {
        isAuth = localStorage.getItem('nasa_auth') === 'true' || sessionStorage.getItem('nasa_auth') === 'true';
      } catch (e) {}

      if (isAuth) {
        unlockApp();
      }

      const input = document.getElementById('input-password');
      if (input) {
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            executeLogin();
          }
        });
      }
    });
  </script>
</body>
</html>
