  <script>
    // 試算表 CSV 串接網址

,260202,江其儒,zuzu,專員,儲備幹部,,O:,02-87939000#2117,0963669727,zuzuchiang,,4C-A7,產品主題,雄獅,主題旅遊部/璽品短線組
,260246,劉名媛,Alice,專員,儲備幹部,,O:,02-87939000#8052,0906935925,alicemliu,,3D-A6,總管,雄獅,經營企劃部/海外企劃組`;

    const DEFAULT_NASA = `時間戳記,中文姓名,NASA幹部職位,出生月日 (MM/DD),你最美麗/帥氣的照片一張,MBTI,興趣,負責業務/專案概述

2026/10/22 下午 4:30:34,郭瓔慈,,10/07,,ENTJ,運動 出去玩,全球coach tour
2026/10/22 下午 5:21:39,龍俞孜,副團長,12/02,,,差旅企劃
2026/10/26 上午 8:42:04,張俽瑜,,08/05,,ISFJ,健行 看海,財務部
2026/10/27 下午 9:39:27,張元齡,,06/21,,ISFJ,培養運動習慣,人才培育
2026/10/29 下午 1:54:36,陳冠廷,團長,04/05,,ENFJ,旅遊、看電影,企本二處 / 供應商管理部`;

    let allMembers = [];

    function parseCSV(text) {
      if (!text) return [];
      const lines = text.split(/\r?\n/).filter(l => l.trim().length > 0);
      return lines.map(line => {
        const row = [];
        let inQuotes = false;
        let cur = '';
        for (let i = 0; i < line.length; i++) {
          const c = line[i];
          if (c === '"') { inQuotes = !inQuotes; }
          else if (c === ',' && !inQuotes) { row.push(cur.trim().replace(/^"|"$/g, '')); cur = ''; }
          else { cur += c; }
        }
        row.push(cur.trim().replace(/^"|"$/g, ''));
        return row;
      });
    }

    function buildRoster(hubbleCsv, nasaCsv) {
      const hRows = parseCSV(hubbleCsv);
      const nRows = parseCSV(nasaCsv);

      const hMap = new Map();
      hRows.forEach(r => {
        if (!r || r.length < 3 || r[2] === '姓名') return;
        const name = r[2].trim();
        if (!name) return;
        hMap.set(name, {
          name,
          englishName: r[3] || '',
          rank: r[4] || '專員',
          title: r[5] || '儲備幹部',
          extension: r[8] || r[7] || '無分機',
          phone: r[9] || '',
          email: r[10] || '',
          seat: r[12] || '待定',
          company: r[14] || '雄獅',
          organization: r[15] || '未分派',
        });
      });

      const nMap = new Map();
      nRows.forEach(r => {
        if (!r || r.length < 2 || r[1] === '中文姓名') return;
        const name = r[1].trim();
        if (!name) return;
        nMap.set(name, {
          nasaRole: r[2] || '',
          birthday: r[3] || '',
          photoUrl: r[4] || '',
          mbti: r[5] || '',
          interests: r[6] || '',
          projectSummary: r[7] || '',
        });
      });

      const names = new Set([...hMap.keys(), ...nMap.keys()]);
      const list = [];
      names.forEach(name => {
        const h = hMap.get(name) || {};
        const n = nMap.get(name) || {};
        list.push({
          name,
          englishName: h.englishName || '',
          rank: h.rank || '專員',
          title: h.title || '儲備幹部',
          extension: h.extension || '無分機',
          phone: h.phone || '',
          email: h.email || '',
          seat: h.seat || '待定',
          company: h.company || '雄獅',
          organization: h.organization || 'NASA專案團隊',
          nasaRole: n.nasaRole || '',
          birthday: n.birthday || '',
          photoUrl: n.photoUrl || '',
          mbti: n.mbti || '',
          interests: n.interests || '',
          projectSummary: n.projectSummary || '',
        });
      });

      return list.sort((a, b) => {
        if (a.nasaRole && !b.nasaRole) return -1;
        if (!a.nasaRole && b.nasaRole) return 1;
        return a.name.localeCompare(b.name, 'zh-Hant');
      });
    }

    function renderUI() {
      const grid = document.getElementById('members-grid');
      const q = document.getElementById('input-search').value.toLowerCase().trim();
      const comp = document.getElementById('select-company').value;
      const org = document.getElementById('select-org').value;

      const filtered = allMembers.filter(m => {
        if (comp !== 'ALL' && m.company !== comp) return false;
        if (org !== 'ALL' && !m.organization.includes(org)) return false;
        if (q && !`${m.name} ${m.englishName} ${m.extension} ${m.seat} ${m.organization}`.toLowerCase().includes(q)) return false;
        return true;
      });

      document.getElementById('stat-total').innerText = allMembers.length;
      document.getElementById('stat-officers').innerText = allMembers.filter(m => m.nasaRole).length;

      grid.innerHTML = filtered.map(m => `
        <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-xs hover:shadow-md transition">
          <div class="flex items-start justify-between mb-3">
            <div>
              <h3 class="text-lg font-bold text-slate-900">${m.name}</h3>
              <p class="text-xs text-slate-400">${m.englishName || 'Member'}</p>
            </div>
            ${m.nasaRole ? `<span class="px-2 py-0.5 text-xs font-bold rounded-full bg-amber-100 text-amber-700">★ ${m.nasaRole}</span>` : `<span class="px-2 py-0.5 text-xs rounded bg-slate-100 text-slate-600">${m.rank}</span>`}
          </div>
          <div class="space-y-1.5 text-xs text-slate-600 border-t pt-3">
            <div>🏢 <span class="font-medium">${m.company}</span> · ${m.organization}</div>
            <div>📍 座位：<b>${m.seat}</b></div>
            <div>📞 分機：<b>${m.extension}</b></div>
            ${m.phone ? `<div>📱 手機：${m.phone}</div>` : ''}
            ${m.email ? `<div>✉️ <a href="mailto:${m.email}" class="text-blue-600">${m.email}</a></div>` : ''}
            ${m.mbti ? `<div class="mt-2"><span class="px-2 py-0.5 rounded bg-purple-50 text-purple-600 font-semibold">MBTI: ${m.mbti}</span></div>` : ''}
          </div>
        </div>
      `).join('');
    }

    function handleFilterChange() { renderUI(); }

    async function fetchWithTimeout(url, ms = 4000) {
      const controller = new AbortController();
      const id = setTimeout(() => controller.abort(), ms);
      try {
        const res = await fetch(url, { signal: controller.signal });
        clearTimeout(id);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return await res.text();
      } catch (e) {
        clearTimeout(id);
        throw e;
      }
    }

    async function syncData() {
      const icon = document.getElementById('sync-icon');
      const text = document.getElementById('sync-text');
      icon.classList.add('animate-spin-custom');
      text.innerText = '連線同步中...';

      try {
        const [resH, resN] = await Promise.all([
          fetchWithTimeout(HUBBLE_URL, 4000),
          fetchWithTimeout(NASA_URL, 4000)
        ]);

        allMembers = buildRoster(resH, resN);
        renderUI();
        document.getElementById('stat-time').innerText = 'Google 雲端已同步';
        showToast('同步成功', '已即時拉取 Google 試算表最新數據！');
      } catch (err) {
        console.warn('Google 試算表請求逾時或被阻擋，切換至備份名冊', err);
        allMembers = buildRoster(DEFAULT_HUBBLE, DEFAULT_NASA);
        renderUI();
        document.getElementById('stat-time').innerText = '使用內建備份';
        showToast('連線提示', 'Google 試算表連線受限，已切換至本機備份名單');
      } finally {
        icon.classList.remove('animate-spin-custom');
        text.innerText = '重新同步 Google 試算表';
      }
    }

    function showToast(title, msg) {
      const toast = document.getElementById('sync-toast');
      document.getElementById('sync-toast-title').innerText = title;
      document.getElementById('sync-toast-msg').innerText = msg;
      toast.classList.remove('hidden-custom');
      setTimeout(() => toast.classList.add('hidden-custom'), 4000);
    }

    function checkAuth() {
      const isAuth = localStorage.getItem('nasa_auth') === 'true';
      if (isAuth) {
        document.getElementById('password-gate').classList.add('hidden-custom');
        document.getElementById('main-app').classList.remove('hidden-custom');
        syncData();
      }
    }

    function handlePasswordSubmit(e) {
      e.preventDefault();
      const p = document.getElementById('input-password').value.trim();
      if (p === 'nasa7885') {
        localStorage.setItem('nasa_auth', 'true');
        checkAuth();
      } else {
        document.getElementById('password-error').classList.remove('hidden-custom');
      }
    }

    function togglePasswordVisibility() {
      const input = document.getElementById('input-password');
      input.type = input.type === 'password' ? 'text' : 'password';
    }

    function lockApp() {
      localStorage.removeItem('nasa_auth');
      location.reload();
    }

    window.addEventListener('DOMContentLoaded', checkAuth);
  </script>
</body>
</html>
