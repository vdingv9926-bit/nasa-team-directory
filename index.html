<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NASA 團員通訊錄 | NASA Team Directory</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '"Noto Sans TC"', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Plus Jakarta Sans', 'Noto Sans TC', system-ui, sans-serif; }
    @keyframes spin-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .animate-spin-custom { animation: spin-slow 1s linear infinite; }
    .hidden-custom { display: none !important; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col font-sans">

  <!-- 密碼驗證鎖定畫面 -->
  <div id="password-gate" class="fixed inset-0 z-50 bg-slate-50 text-slate-800 flex items-center justify-center p-4">
    <div class="w-full max-w-md relative z-10 bg-white border border-slate-200/90 rounded-3xl p-7 sm:p-9 shadow-xl">
      <div class="flex flex-col items-center text-center mb-7">
        <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-blue-700 via-indigo-600 to-sky-500 flex items-center justify-center text-white shadow-md mb-4 font-bold text-xl">
          NASA
        </div>
        <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[11px] font-mono font-semibold tracking-wider bg-blue-50 text-blue-700 border border-blue-100 mb-2">
          SECURITY VERIFICATION
        </div>
        <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">NASA 團員通訊錄</h1>
        <p class="text-xs text-slate-500 mt-1.5">團隊內部資訊系統，請輸入通行密碼解鎖</p>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-2">存取密碼</label>
          <div class="relative">
            <input id="input-password" type="password" placeholder="請輸入密碼..." class="w-full pl-4 pr-11 py-3 text-sm bg-slate-50 hover:bg-slate-100/70 focus:bg-white text-slate-900 border border-slate-200 rounded-xl focus:border-blue-500 focus:outline-none font-mono">
            <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400">
              <span id="eye-icon">👁️</span>
            </button>
          </div>
          <p id="password-error" class="hidden-custom text-xs text-rose-500 mt-2 font-medium">密碼不正確，請重新輸入</p>
        </div>

        <div class="flex items-center gap-2 pt-1 text-xs text-slate-600">
          <input id="checkbox-remember" type="checkbox" checked class="w-4 h-4 rounded border-slate-300 text-blue-600">
          <label for="checkbox-remember" class="cursor-pointer">記住登入狀態</label>
        </div>

        <button type="button" id="btn-login" class="w-full mt-2 py-3 px-4 text-sm font-semibold rounded-xl text-white bg-blue-600 hover:bg-blue-700 shadow-md transition-all cursor-pointer">
          解鎖並進入通訊錄 →
        </button>
      </div>
    </div>
  </div>

  <!-- 主應用介面 -->
  <div id="main-app" class="hidden-custom flex-1 flex flex-col">
    <header class="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-slate-200 shadow-xs">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16 gap-4">
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl bg-blue-600 text-white flex items-center justify-center font-extrabold text-sm shadow-sm">
              NASA
            </div>
            <div>
              <h1 class="text-lg font-bold text-slate-900 tracking-tight">NASA 團員通訊錄</h1>
            </div>
          </div>

          <div class="hidden md:flex items-center gap-6 text-xs text-slate-500 font-medium">
            <div>成員總數：<span id="stat-total" class="font-bold text-slate-800 font-mono">0</span> 位</div>
            <span>·</span>
            <div>幹部人數：<span id="stat-officers" class="font-bold text-amber-700 font-mono">0</span> 位</div>
            <span>·</span>
            <div>資料狀態：<span id="stat-time" class="text-blue-600 font-mono">已就緒</span></div>
          </div>

          <div class="flex items-center gap-3">
            <button onclick="lockApp()" class="p-2 text-slate-400 hover:text-rose-600 text-xs cursor-pointer">登出鎖定</button>
            <button id="btn-sync" onclick="syncData()" class="inline-flex items-center gap-1.5 px-3.5 py-2 text-xs font-semibold rounded-xl text-white bg-blue-600 hover:bg-blue-700 shadow-xs cursor-pointer">
              <svg id="sync-icon" class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
              </svg>
              <span id="sync-text">同步試算表</span>
            </button>
          </div>
        </div>
      </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
      <!-- 搜尋與下拉篩選 -->
      <div class="bg-white rounded-2xl border border-slate-200 p-4 mb-6 shadow-xs flex flex-col md:flex-row gap-3">
        <input id="input-search" oninput="handleFilterChange()" type="text" placeholder="搜尋中文姓名、英文別名、分機、座位、關鍵字..." class="flex-grow px-3.5 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
        <select id="select-company" onchange="handleFilterChange()" class="px-3 py-2 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl text-slate-700 outline-none">
          <option value="ALL">全部公司</option>
        </select>
        <select id="select-org" onchange="handleFilterChange()" class="px-3 py-2 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl text-slate-700 outline-none">
          <option value="ALL">全部組織部門</option>
        </select>
        <button id="btn-officers" onclick="toggleOfficersFilter()" class="px-3 py-2 text-xs sm:text-sm font-medium rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 cursor-pointer whitespace-nowrap">
          僅看幹部
        </button>
      </div>

      <!-- 成員卡片網格 -->
      <div id="members-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
      
      <div id="empty-state" class="hidden-custom bg-white rounded-3xl border border-dashed border-slate-300 p-12 text-center max-w-lg mx-auto my-12">
        <h3 class="text-lg font-bold text-slate-800">查無符合條件的成員</h3>
      </div>
    </main>
  </div>

  <!-- 詳細視窗 Modal -->
  <div id="detail-modal" class="hidden-custom fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm" onclick="
